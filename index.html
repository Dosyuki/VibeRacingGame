<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#07070c" />
    <title>Neon Drift</title>
    <style>
      /* touch-action lives on html so the browser intersects it down the whole
         ancestor chain — asserting it on the controls alone does not stop the
         browser from claiming a drag as a scroll gesture. */
      html {
        touch-action: none;
        overscroll-behavior: none;
        background: #07070c;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      body {
        color: #e8ecf4;
        font: 400 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-user-select: none;
        user-select: none;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #app canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      /* Shown until the first frame presents. Diagnostics keys off this: a boot
         failure leaves this visible, which is a signal a screenshot can read. */
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #07070c;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        font-size: 13px;
        color: #4a5570;
        transition: opacity 240ms ease;
      }
      #boot[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot">loading</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
